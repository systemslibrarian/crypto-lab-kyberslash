name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests (crypto KATs + honest attack)
        run: npm test

      - name: Timing-model and attack checks
        run: |
          npm run verify:phase1
          npm run verify:phase2
          npm run verify:phase3
          npm run verify:phase7

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: UI smoke and interaction checks
        run: |
          npm run preview -- --port 4705 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4705/crypto-lab-kyberslash/ >/dev/null; then
              echo "preview is up"
              break
            fi
            sleep 1
          done
          npm run verify:ui
          npm run verify:ui:interactions
          kill "$SERVER_PID" 2>/dev/null || true

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: verify
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Merge minor and patch bumps
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
