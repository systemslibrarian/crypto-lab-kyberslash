<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="KyberSlash lab poster — a vulnerable timing trace swings while the patched trace stays flat, and a 768-coefficient secret key is recovered.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071118"/>
      <stop offset="0.58" stop-color="#08151f"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.12" cy="0.05" r="0.45">
      <stop offset="0" stop-color="#ff3366" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff3366" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.9" cy="0.05" r="0.45">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e7200"/>
      <stop offset="1" stop-color="#ffd700"/>
    </linearGradient>
    <style>
      .mono { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowRed)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#00d4ff" stroke-opacity="0.18"/>

  <!-- Brand -->
  <g transform="translate(64,56)">
    <rect width="44" height="44" rx="10" fill="none" stroke="#35d6bb" stroke-width="1.5"/>
    <text x="22" y="29" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#9af5e2">CL</text>
    <text x="60" y="18" class="mono" font-size="15" letter-spacing="4" fill="#eafff8" font-weight="700">CRYPTO LAB</text>
    <text x="60" y="38" class="mono" font-size="12" letter-spacing="2" fill="#5e8b80">systemslibrarian.dev</text>
  </g>
  <text x="1136" y="74" text-anchor="end" class="mono" font-size="13" letter-spacing="2" fill="#94a8b7">ML-KEM-768 · FIPS 203</text>

  <!-- Title -->
  <text x="64" y="178" class="sans" font-size="74" font-weight="800" letter-spacing="-2" fill="#eef6fb">KyberSlash</text>
  <text x="66" y="226" class="sans" font-size="27" fill="#94a8b7">How a single CPU division leaked a post-quantum secret key</text>

  <!-- Two oscilloscope panels -->
  <!-- Vulnerable -->
  <g transform="translate(64,276)">
    <rect width="510" height="196" rx="18" fill="#0a1622" stroke="#ff3366" stroke-opacity="0.35"/>
    <text x="22" y="34" class="mono" font-size="13" letter-spacing="3" fill="#ff8aa1" font-weight="700">VULNERABLE · DIVIDE BY q</text>
    <line x1="22" y1="150" x2="488" y2="150" stroke="#ffffff" stroke-opacity="0.10"/>
    <polyline fill="none" stroke="#ff3366" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"
      points="22,120 58,72 94,138 130,60 166,128 202,86 238,150 274,74 310,134 346,64 382,142 418,92 454,118 488,70"/>
    <text x="22" y="180" class="mono" font-size="13" fill="#94a8b7">spread: secret-dependent · the leak</text>
  </g>
  <!-- Patched -->
  <g transform="translate(626,276)">
    <rect width="510" height="196" rx="18" fill="#0a1622" stroke="#00ff88" stroke-opacity="0.32"/>
    <text x="22" y="34" class="mono" font-size="13" letter-spacing="3" fill="#6dffb6" font-weight="700">PATCHED · BARRETT REDUCTION</text>
    <line x1="22" y1="150" x2="488" y2="150" stroke="#ffffff" stroke-opacity="0.10"/>
    <polyline fill="none" stroke="#00ff88" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"
      points="22,104 58,103 94,105 130,103 166,104 202,103 238,105 274,104 310,103 346,105 382,104 418,103 454,104 488,104"/>
    <text x="22" y="180" class="mono" font-size="13" fill="#94a8b7">flat · constant-time · same dataset</text>
  </g>

  <!-- Recovery strip + verdict -->
  <g transform="translate(64,512)">
    <text x="0" y="14" class="mono" font-size="13" letter-spacing="2" fill="#94a8b7">SECRET KEY RECOVERY</text>
    <g transform="translate(0,26)" font-size="14" font-weight="700" class="mono" text-anchor="middle">
      <!-- 24 sample cells -->
      <g>
        <rect x="0"   width="26" height="26" rx="5" fill="#00ff88" fill-opacity="0.14" stroke="#00ff88" stroke-opacity="0.34"/><text x="13" y="18" fill="#6dffb6">+</text>
        <rect x="30"  width="26" height="26" rx="5" fill="#ff3366" fill-opacity="0.16" stroke="#ff3366" stroke-opacity="0.32"/><text x="43" y="18" fill="#ff8aa1">−</text>
        <rect x="60"  width="26" height="26" rx="5" fill="#00d4ff" fill-opacity="0.10" stroke="#00d4ff" stroke-opacity="0.28"/><text x="73" y="18" fill="#cfe1ee">0</text>
        <rect x="90"  width="26" height="26" rx="5" fill="#00ff88" fill-opacity="0.14" stroke="#00ff88" stroke-opacity="0.34"/><text x="103" y="18" fill="#6dffb6">+</text>
        <rect x="120" width="26" height="26" rx="5" fill="#00d4ff" fill-opacity="0.10" stroke="#00d4ff" stroke-opacity="0.28"/><text x="133" y="18" fill="#cfe1ee">0</text>
        <rect x="150" width="26" height="26" rx="5" fill="#ff3366" fill-opacity="0.16" stroke="#ff3366" stroke-opacity="0.32"/><text x="163" y="18" fill="#ff8aa1">−</text>
        <rect x="180" width="26" height="26" rx="5" fill="#00ff88" fill-opacity="0.14" stroke="#00ff88" stroke-opacity="0.34"/><text x="193" y="18" fill="#6dffb6">+</text>
        <rect x="210" width="26" height="26" rx="5" fill="#00ff88" fill-opacity="0.14" stroke="#00ff88" stroke-opacity="0.34"/><text x="223" y="18" fill="#6dffb6">+</text>
        <rect x="240" width="26" height="26" rx="5" fill="#ff3366" fill-opacity="0.16" stroke="#ff3366" stroke-opacity="0.32"/><text x="253" y="18" fill="#ff8aa1">−</text>
        <rect x="270" width="26" height="26" rx="5" fill="#00d4ff" fill-opacity="0.10" stroke="#00d4ff" stroke-opacity="0.28"/><text x="283" y="18" fill="#cfe1ee">0</text>
        <rect x="300" width="26" height="26" rx="5" fill="#00ff88" fill-opacity="0.14" stroke="#00ff88" stroke-opacity="0.34"/><text x="313" y="18" fill="#6dffb6">+</text>
        <rect x="330" width="26" height="26" rx="5" fill="#ff3366" fill-opacity="0.16" stroke="#ff3366" stroke-opacity="0.32"/><text x="343" y="18" fill="#ff8aa1">−</text>
      </g>
    </g>
  </g>

  <!-- gold verdict pill -->
  <g transform="translate(706,520)">
    <rect width="430" height="46" rx="23" fill="#ffd700" fill-opacity="0.10" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="30" cy="23" r="7" fill="#ffd700"/>
    <text x="52" y="29" class="mono" font-size="16" font-weight="700" fill="#ffd700">768 / 768 — recovered key matches secret</text>
  </g>
</svg>
